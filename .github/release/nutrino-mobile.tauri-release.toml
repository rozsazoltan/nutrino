[project]
project_dir = "apps/mobile"
package_manager = "aube"
install_command = "aube install"

[output]
clean = true
sha256 = true
manifest = true

[artifacts]
include_extensions = ["apk", "aab", "ipa", "sig"]
include_files = ["latest.json", "release.json", "release-manifest.json"]
keep_relative_paths = false
allow_empty = false

[linux]
enabled = false
strategy = "disabled"

[windows]
enabled = false
strategy = "disabled"

[macos]
enabled = false
strategy = "disabled"

[android]
enabled = true
strategy = "host-only"
apk = true
aab = true
split_per_abi = false
targets = ["aarch64"]
command = "aube run android:build:release --filter nutrino-mobile"

[ios]
enabled = true
strategy = "host-only"
targets = []
command = "aube run ios:build --filter nutrino-mobile"

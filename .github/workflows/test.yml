name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.1"

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Run repository checks
        shell: bash
        run: pnpm check

      - name: Type-check mobile app
        shell: bash
        run: pnpm --filter nutrino-mobile build

      - name: Type-check desktop app
        shell: bash
        run: pnpm --filter nutrino-desktop build

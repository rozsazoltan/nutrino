name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  AUBE_NO_UPDATE_CHECK: "1"
  AUBE_STORE_DIR: ${{ github.workspace }}/.cache/aube/store
  AUBE_CACHE_DIR: ${{ github.workspace }}/.cache/aube/cache

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore aube cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/aube
          key: aube-store-test-v1-${{ runner.os }}-${{ hashFiles('aube-workspace.yaml', '**/package.json') }}
          restore-keys: |
            aube-store-test-v1-${{ runner.os }}-
            aube-store-v1-${{ runner.os }}-

      - name: Set up aube
        uses: verzly/setup-aube@v1
        with:
          run_install: true

      - name: Run repository checks
        shell: bash
        run: aube run check

      - name: Type-check mobile app
        shell: bash
        run: aube run build --filter nutrino-mobile

      - name: Type-check desktop app
        shell: bash
        run: aube run build --filter nutrino-desktop

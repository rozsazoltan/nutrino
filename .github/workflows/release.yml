name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v, for example 0.14.0"
        required: true
        type: string
      ref:
        description: "Target branch to release from and merge back into"
        required: false
        default: master
        type: string
      release_name_prefix:
        description: "GitHub Release title prefix"
        required: false
        default: "Nutrino "
        type: string
      release_name_suffix:
        description: "GitHub Release title suffix"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"
  AUBE_NO_UPDATE_CHECK: "1"
  AUBE_STORE_DIR: ${{ github.workspace }}/.cache/aube/store
  AUBE_CACHE_DIR: ${{ github.workspace }}/.cache/aube/cache
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ANDROID_NDK_VERSION: "27.0.11718014"
  RELEASE_ARTIFACT_DIR: dist/release-artifacts
  RELEASE_UPLOAD_DIR: dist/release-upload

jobs:
  prepare-release:
    name: Prepare release branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      version_tag: ${{ steps.prepare.outputs.version_tag }}
      release_branch: ${{ steps.prepare.outputs.release_branch }}
      target_branch: ${{ steps.prepare.outputs.target_branch }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install github-release
        uses: verzly/github-release@latest
        with:
          install-only: true

      - name: Prepare release branch
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          github-release prepare \
            --version "${{ inputs.version }}" \
            --target-branch "${{ inputs.ref }}" \
            --config ".github/release/nutrino.github-release.toml"

  check-ios-signing:
    name: Check iOS signing
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Detect Apple signing secrets
        id: detect
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "${APPLE_TEAM_ID}" ] \
            && [ -n "${IOS_CERTIFICATE_P12_BASE64}" ] \
            && [ -n "${IOS_CERTIFICATE_PASSWORD}" ] \
            && [ -n "${IOS_PROVISIONING_PROFILE_BASE64}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Signed iOS release build is enabled"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Signed iOS release build is skipped because Apple signing secrets are incomplete"
          fi

  build-desktop:
    name: Build desktop ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            flag: --linux
            artifact: desktop-linux
            rust_targets: ""
          - platform: windows
            os: windows-latest
            flag: --windows
            artifact: desktop-windows
            rust_targets: x86_64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            flag: --macos
            artifact: desktop-macos
            rust_targets: "x86_64-apple-darwin aarch64-apple-darwin"
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          fetch-depth: 0

      - name: Install github-release
        uses: verzly/github-release@latest
        with:
          install-only: true

      - name: Verify release branch commit
        shell: bash
        run: github-release assert-head --sha "${{ needs.prepare-release.outputs.release_sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore aube cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/aube
          key: aube-store-release-v1-${{ runner.os }}-${{ hashFiles('aube-workspace.yaml', '**/package.json') }}
          restore-keys: |
            aube-store-release-v1-${{ runner.os }}-
            aube-store-v1-${{ runner.os }}-

      - name: Set up aube
        uses: verzly/setup-aube@v1
        with:
          run_install: true

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          if [ -n "${{ matrix.rust_targets }}" ]; then
            rustup target add ${{ matrix.rust_targets }}
          fi
          rustc --version
          cargo --version

      - name: Restore Cargo and Tauri cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/tauri-release
            apps/desktop/src-tauri/target
          key: cargo-tauri-desktop-v2-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml', '.github/release/nutrino-desktop.tauri-release.toml') }}
          restore-keys: |
            cargo-tauri-desktop-v2-${{ runner.os }}-${{ matrix.platform }}-
            cargo-tauri-desktop-v2-${{ runner.os }}-
            cargo-tauri-v2-${{ runner.os }}-

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Build desktop artifacts
        uses: verzly/tauri-release@latest
        with:
          args: >-
            build
            --config .github/release/nutrino-desktop.tauri-release.toml
            --output dist/release/${{ matrix.artifact }}
            ${{ matrix.flag }}
            --verbose

      - name: Upload desktop artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: nutrino-desktop-${{ matrix.platform }}
          path: dist/release/${{ matrix.artifact }}/**/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          fetch-depth: 0

      - name: Install github-release
        uses: verzly/github-release@latest
        with:
          install-only: true

      - name: Verify release branch commit
        shell: bash
        run: github-release assert-head --sha "${{ needs.prepare-release.outputs.release_sha }}"

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing secret: ${name}"
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore aube cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/aube
          key: aube-store-release-v1-${{ runner.os }}-${{ hashFiles('aube-workspace.yaml', '**/package.json') }}
          restore-keys: |
            aube-store-release-v1-${{ runner.os }}-
            aube-store-v1-${{ runner.os }}-

      - name: Set up aube
        uses: verzly/setup-aube@v1
        with:
          run_install: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Restore Android build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cache/tauri-release
            apps/mobile/src-tauri/target
            apps/mobile/src-tauri/gen/android/.gradle
          key: android-release-v2-${{ runner.os }}-${{ hashFiles('apps/mobile/src-tauri/Cargo.lock', 'apps/mobile/src-tauri/Cargo.toml', 'apps/mobile/src-tauri/gen/android/**/*.gradle*', 'apps/mobile/src-tauri/gen/android/**/gradle-wrapper.properties', '.github/release/nutrino-mobile.tauri-release.toml') }}
          restore-keys: |
            android-release-v2-${{ runner.os }}-
            cargo-tauri-v2-${{ runner.os }}-

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK_PATH="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "${GITHUB_ENV}"
          echo "NDK_HOME=${NDK_PATH}" >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"

      - name: Build Android artifacts
        uses: verzly/tauri-release@latest
        env:
          NUTRINO_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NUTRINO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NUTRINO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NUTRINO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          args: >-
            build
            --config .github/release/nutrino-mobile.tauri-release.toml
            --output dist/release/mobile-android
            --android
            --verbose

      - name: Upload Android artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: nutrino-mobile-android
          path: dist/release/mobile-android/**/*
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build signed iOS
    needs:
      - prepare-release
      - check-ios-signing
    if: needs.check-ios-signing.outputs.enabled == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          fetch-depth: 0

      - name: Install github-release
        uses: verzly/github-release@latest
        with:
          install-only: true

      - name: Verify release branch commit
        shell: bash
        run: github-release assert-head --sha "${{ needs.prepare-release.outputs.release_sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore aube cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/aube
          key: aube-store-release-v1-${{ runner.os }}-${{ hashFiles('aube-workspace.yaml', '**/package.json') }}
          restore-keys: |
            aube-store-release-v1-${{ runner.os }}-
            aube-store-v1-${{ runner.os }}-

      - name: Set up aube
        uses: verzly/setup-aube@v1
        with:
          run_install: true

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Restore iOS Cargo and Tauri cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/tauri-release
            apps/mobile/src-tauri/target
          key: cargo-tauri-ios-v2-${{ runner.os }}-${{ hashFiles('apps/mobile/src-tauri/Cargo.lock', 'apps/mobile/src-tauri/Cargo.toml', '.github/release/nutrino-mobile.tauri-release.toml') }}
          restore-keys: |
            cargo-tauri-ios-v2-${{ runner.os }}-
            cargo-tauri-v2-${{ runner.os }}-

      - name: Import Apple signing assets
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="${RUNNER_TEMP}/ios-certificate.p12"
          PROFILE_PATH="${RUNNER_TEMP}/ios-profile.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "${IOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          printf '%s' "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${IOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          PROFILE_UUID="$(security cms -D -i "${PROFILE_PATH}" | plutil -extract UUID raw -)"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      - name: Build iOS artifact
        uses: verzly/tauri-release@latest
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: >-
            build
            --config .github/release/nutrino-mobile.tauri-release.toml
            --output dist/release/mobile-ios
            --ios
            --verbose

      - name: Upload iOS artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: nutrino-mobile-ios
          path: dist/release/mobile-ios/**/*
          if-no-files-found: error
          retention-days: 7

  finalize-release:
    name: Finalize GitHub Release
    needs:
      - prepare-release
      - check-ios-signing
      - build-desktop
      - build-android
      - build-ios
    if: >-
      always()
      && needs.prepare-release.result == 'success'
      && needs.check-ios-signing.result == 'success'
      && needs.build-desktop.result == 'success'
      && needs.build-android.result == 'success'
      && (
        needs.check-ios-signing.outputs.enabled != 'true'
        || needs.build-ios.result == 'success'
      )
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.target_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download release build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nutrino-*
          path: ${{ env.RELEASE_ARTIFACT_DIR }}
          merge-multiple: false

      - name: Prepare clean release upload assets
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import re
          import shutil
          from pathlib import Path

          source = Path(os.environ['RELEASE_ARTIFACT_DIR'])
          target = Path(os.environ['RELEASE_UPLOAD_DIR'])
          version = os.environ['VERSION']
          target.mkdir(parents=True, exist_ok=True)

          if not source.exists():
              raise SystemExit('No downloaded release artifacts found')

          group_prefixes = {
              'nutrino-desktop-linux': 'nutrino-desktop-linux',
              'nutrino-desktop-windows': 'nutrino-desktop-windows',
              'nutrino-desktop-macos': 'nutrino-desktop-macos',
              'nutrino-mobile-android': 'nutrino-mobile-android',
              'nutrino-mobile-ios': 'nutrino-mobile-ios',
          }

          release_extensions = (
              '.appimage',
              '.deb',
              '.rpm',
              '.dmg',
              '.exe',
              '.msi',
              '.apk',
              '.aab',
              '.ipa',
          )

          def clean_token(value):
              value = re.sub(r'[^A-Za-z0-9._-]+', '-', value).strip('-')
              return value.lower() or 'artifact'

          def artifact_extension(name):
              lower = name.lower()
              for extension in release_extensions:
                  if lower.endswith(extension):
                      if extension == '.appimage':
                          return '.AppImage'
                      return name[-len(extension):]
              return None

          def checksum(path):
              hasher = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      hasher.update(chunk)
              return hasher.hexdigest()

          copied = 0
          for file in sorted(source.rglob('*')):
              if not file.is_file():
                  continue

              if file.name == 'release-manifest.json' or file.name.endswith('.sha256'):
                  continue

              extension = artifact_extension(file.name)
              if extension is None:
                  continue

              relative = file.relative_to(source)
              group = relative.parts[0] if len(relative.parts) > 1 else 'artifact'
              prefix = group_prefixes.get(group, clean_token(group))
              destination = target / f'{prefix}-{version}{extension}'

              if destination.exists():
                  stem = clean_token(Path(file.name).stem)
                  destination = target / f'{prefix}-{version}-{stem}{extension}'
              if destination.exists():
                  raise SystemExit(f'Artifact collision while staging {file}: {destination} already exists')

              shutil.copy2(file, destination)
              digest = checksum(destination)
              destination.with_name(destination.name + '.sha256').write_text(
                  f'{digest}  {destination.name}\n',
                  encoding='utf-8',
              )
              copied += 1

          if copied == 0:
              raise SystemExit('No release files were staged for upload')

          print(f'Staged {copied} release asset(s) with clean release filenames')
          PY

          find "${RELEASE_UPLOAD_DIR}" -maxdepth 1 -type f -print | sort

      - name: Install github-release
        uses: verzly/github-release@latest
        with:
          install-only: true

      - name: Finalize release
        shell: bash
        run: |
          set -euo pipefail

          github-release finalize \
            --version "${{ needs.prepare-release.outputs.version }}" \
            --release-branch "${{ needs.prepare-release.outputs.release_branch }}" \
            --target-branch "${{ needs.prepare-release.outputs.target_branch }}" \
            --expected-sha "${{ needs.prepare-release.outputs.release_sha }}" \
            --release-name-prefix "${{ inputs.release_name_prefix }}" \
            --release-name-suffix "${{ inputs.release_name_suffix }}" \
            --assets "${RELEASE_UPLOAD_DIR}" \
            --config ".github/release/nutrino.github-release.toml"

  cleanup-failed-release-branch:
    name: Delete failed release branch
    needs:
      - prepare-release
      - check-ios-signing
      - build-desktop
      - build-android
      - build-ios
      - finalize-release
    if: >-
      always()
      && needs.prepare-release.result == 'success'
      && needs.finalize-release.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install github-release
        uses: verzly/github-release@latest
        with:
          install-only: true

      - name: Cleanup release branch
        shell: bash
        run: |
          set -euo pipefail

          github-release cleanup \
            --release-branch "${{ needs.prepare-release.outputs.release_branch }}"

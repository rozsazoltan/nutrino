name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v, for example 0.11.18"
        required: true
        type: string
      ref:
        description: "Git ref to release"
        required: false
        default: master
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.32.1"
  ANDROID_NDK_VERSION: "27.0.11718014"

jobs:
  validate-release:
    name: Validate release input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.previous-tag.outputs.previous_tag }}
      target_sha: ${{ steps.target.outputs.target_sha }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          RAW_VERSION="${{ inputs.version }}"
          VERSION="${RAW_VERSION#v}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be a full semantic version, for example 0.11.18"
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Resolve target commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "target_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Validate repository versions
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const version = process.env.VERSION;
          const failures = [];

          function readJson(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }

          function expect(label, actual, expected = version) {
            if (String(actual) !== String(expected)) {
              failures.push(`${label}: expected ${expected}, got ${actual}`);
            }
          }

          function cargoVersion(path) {
            const content = fs.readFileSync(path, 'utf8');
            const match = content.match(/^version\s*=\s*"([^"]+)"/m);
            if (!match) throw new Error(`Missing package version in ${path}`);
            return match[1];
          }

          const [major, minor, patch] = version.split('.').map(Number);
          const expectedAndroidVersionCode = major * 10000 + minor * 100 + patch;

          expect('package.json', readJson('package.json').version);
          expect('packages/shared/package.json', readJson('packages/shared/package.json').version);
          expect('packages/ui/package.json', readJson('packages/ui/package.json').version);
          expect('apps/desktop/package.json', readJson('apps/desktop/package.json').version);
          expect('apps/mobile/package.json', readJson('apps/mobile/package.json').version);
          expect('apps/desktop/src-tauri/tauri.conf.json', readJson('apps/desktop/src-tauri/tauri.conf.json').version);
          expect('apps/mobile/src-tauri/tauri.conf.json', readJson('apps/mobile/src-tauri/tauri.conf.json').version);
          expect('apps/desktop/src-tauri/Cargo.toml', cargoVersion('apps/desktop/src-tauri/Cargo.toml'));
          expect('apps/mobile/src-tauri/Cargo.toml', cargoVersion('apps/mobile/src-tauri/Cargo.toml'));
          expect(
            'apps/mobile/src-tauri/tauri.conf.json bundle.android.versionCode',
            readJson('apps/mobile/src-tauri/tauri.conf.json').bundle?.android?.versionCode,
            expectedAndroidVersionCode,
          );

          if (failures.length > 0) {
            console.error(failures.map((item) => `- ${item}`).join('\n'));
            process.exit(1);
          }
          NODE

      - name: Resolve previous full release tag
        id: previous-tag
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          PREVIOUS_TAG="$(python3 <<'PY'
          import os
          import re
          import subprocess

          current = tuple(int(part) for part in os.environ['VERSION'].split('.'))
          pattern = re.compile(r'^v(\d+)\.(\d+)\.(\d+)$')
          tags = subprocess.check_output(['git', 'tag', '--list'], text=True).splitlines()
          candidates = []
          for tag in tags:
              match = pattern.match(tag.strip())
              if not match:
                  continue
              value = tuple(int(part) for part in match.groups())
              if value < current:
                  candidates.append((value, tag.strip()))
          candidates.sort()
          print(candidates[-1][1] if candidates else '')
          PY
          )"

          echo "previous_tag=${PREVIOUS_TAG}" >> "${GITHUB_OUTPUT}"
          if [ -n "${PREVIOUS_TAG}" ]; then
            echo "Previous release tag: ${PREVIOUS_TAG}"
          else
            echo "No previous full release tag found"
          fi

  check-ios-signing:
    name: Check iOS signing
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Detect Apple signing secrets
        id: detect
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "${APPLE_TEAM_ID}" ] \
            && [ -n "${IOS_CERTIFICATE_P12_BASE64}" ] \
            && [ -n "${IOS_CERTIFICATE_PASSWORD}" ] \
            && [ -n "${IOS_PROVISIONING_PROFILE_BASE64}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Signed iOS release build is enabled"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Signed iOS release build is skipped because Apple signing secrets are incomplete"
          fi

  build-desktop:
    name: Build desktop ${{ matrix.platform }}
    needs: validate-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            flag: --linux
            artifact: desktop-linux
            rust_targets: ""
          - platform: windows
            os: windows-latest
            flag: --windows
            artifact: desktop-windows
            rust_targets: x86_64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            flag: --macos
            artifact: desktop-macos
            rust_targets: "x86_64-apple-darwin aarch64-apple-darwin"
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          if [ -n "${{ matrix.rust_targets }}" ]; then
            rustup target add ${{ matrix.rust_targets }}
          fi
          rustc --version
          cargo --version

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      - name: Build desktop artifacts
        uses: verzly/tauri-release@latest
        with:
          args: >-
            build
            --config .github/release/nutrino-desktop.tauri-release.toml
            --output dist/release/${{ matrix.artifact }}
            ${{ matrix.flag }}
            --verbose

      - name: Upload desktop artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: nutrino-${{ matrix.artifact }}
          path: dist/release/${{ matrix.artifact }}/**/*
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android
          rustc --version
          cargo --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          NDK_PATH="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "${GITHUB_ENV}"
          echo "NDK_HOME=${NDK_PATH}" >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      - name: Build Android artifacts
        uses: verzly/tauri-release@latest
        with:
          args: >-
            build
            --config .github/release/nutrino-mobile.tauri-release.toml
            --output dist/release/mobile-android
            --android
            --verbose

      - name: Upload Android artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: nutrino-mobile-android
          path: dist/release/mobile-android/**/*
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: Build signed iOS
    needs:
      - validate-release
      - check-ios-signing
    if: needs.check-ios-signing.outputs.enabled == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-release.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      - name: Import Apple signing assets
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="${RUNNER_TEMP}/ios-certificate.p12"
          PROFILE_PATH="${RUNNER_TEMP}/ios-profile.mobileprovision"
          KEYCHAIN_PATH="${RUNNER_TEMP}/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "${IOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          printf '%s' "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${IOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          PROFILE_UUID="$(security cms -D -i "${PROFILE_PATH}" | plutil -extract UUID raw -)"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE_PATH}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

      - name: Build iOS artifact
        uses: verzly/tauri-release@latest
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: >-
            build
            --config .github/release/nutrino-mobile.tauri-release.toml
            --output dist/release/mobile-ios
            --ios
            --verbose

      - name: Upload iOS artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: nutrino-mobile-ios
          path: dist/release/mobile-ios/**/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs:
      - validate-release
      - check-ios-signing
      - build-desktop
      - build-android
      - build-ios
    if: >-
      always()
      && needs.validate-release.result == 'success'
      && needs.check-ios-signing.result == 'success'
      && needs.build-desktop.result == 'success'
      && needs.build-android.result == 'success'
      && (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-release.outputs.version }}
      TAG: ${{ needs.validate-release.outputs.tag }}
      TARGET_SHA: ${{ needs.validate-release.outputs.target_sha }}
      PREVIOUS_TAG: ${{ needs.validate-release.outputs.previous_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/release-artifacts

      - name: Prepare clean release upload assets
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import re
          import shutil
          from pathlib import Path

          source = Path('dist/release-artifacts')
          target = Path('dist/release-upload')
          version = os.environ['VERSION']
          target.mkdir(parents=True, exist_ok=True)

          if not source.exists():
              raise SystemExit('No downloaded release artifacts found')

          group_prefixes = {
              'nutrino-desktop-linux': 'nutrino-desktop-linux',
              'nutrino-desktop-windows': 'nutrino-desktop-windows',
              'nutrino-desktop-macos': 'nutrino-desktop-macos',
              'nutrino-mobile-android': 'nutrino-mobile-android',
              'nutrino-mobile-ios': 'nutrino-mobile-ios',
          }

          release_extensions = (
              '.appimage',
              '.deb',
              '.rpm',
              '.dmg',
              '.exe',
              '.msi',
              '.apk',
              '.aab',
              '.ipa',
          )

          def clean_token(value):
              value = re.sub(r'[^A-Za-z0-9._-]+', '-', value).strip('-')
              return value.lower() or 'artifact'

          def artifact_extension(name):
              lower = name.lower()
              for extension in release_extensions:
                  if lower.endswith(extension):
                      if extension == '.appimage':
                          return '.AppImage'
                      return name[-len(extension):]
              return None

          def checksum(path):
              hasher = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      hasher.update(chunk)
              return hasher.hexdigest()

          copied = 0
          for file in sorted(source.rglob('*')):
              if not file.is_file():
                  continue

              if file.name == 'release-manifest.json' or file.name.endswith('.sha256'):
                  continue

              extension = artifact_extension(file.name)
              if extension is None:
                  continue

              relative = file.relative_to(source)
              group = relative.parts[0] if len(relative.parts) > 1 else 'artifact'
              prefix = group_prefixes.get(group, clean_token(group))
              destination = target / f'{prefix}-{version}{extension}'

              if destination.exists():
                  stem = clean_token(Path(file.name).stem)
                  destination = target / f'{prefix}-{version}-{stem}{extension}'
              if destination.exists():
                  raise SystemExit(f'Artifact collision while staging {file}: {destination} already exists')

              shutil.copy2(file, destination)
              digest = checksum(destination)
              destination.with_name(destination.name + '.sha256').write_text(
                  f'{digest}  {destination.name}\n',
                  encoding='utf-8',
              )
              copied += 1

          if copied == 0:
              raise SystemExit('No release files were staged for upload')

          print(f'Staged {copied} release asset(s) with clean release filenames')
          PY

          find dist/release-upload -maxdepth 1 -type f -print | sort

      - name: Generate GitHub release notes
        shell: bash
        run: |
          set -euo pipefail

          ARGS=(
            --method POST
            -F "tag_name=${TAG}"
            -F "target_commitish=${TARGET_SHA}"
          )

          if [ -n "${PREVIOUS_TAG}" ]; then
            ARGS+=( -F "previous_tag_name=${PREVIOUS_TAG}" )
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${ARGS[@]}" --jq '.body' > release-notes.md

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Nutrino v${VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              --target "${TARGET_SHA}" \
              --title "Nutrino v${VERSION}" \
              --notes-file release-notes.md
          fi

      - name: Upload release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/release-upload/* --clobber
